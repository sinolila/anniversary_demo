<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Meteor Shower</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    height: 100vh;
    width: 100vw;
    cursor: default;
    user-select: none;
  }
  canvas#starfield { position: fixed; top: 0; left: 0; z-index: 0; }
  #meteor-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
  #ui-layer > * { pointer-events: auto; }

  /* Top bar */
  #top-bar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  .btn {
    padding: 8px 20px; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px; background: rgba(255,255,255,0.06);
    color: #ccc; font-size: 14px; cursor: pointer;
    backdrop-filter: blur(10px); transition: all 0.3s;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.5); }
  .btn.active { background: rgba(100,180,255,0.25); color: #a0d0ff; border-color: rgba(100,180,255,0.6); }

  /* Bottom bar */
  #music-bar {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px; border-radius: 24px;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  #music-bar .btn { padding: 6px 14px; font-size: 12px; }
  #song-info { color: #999; font-size: 13px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #volume-slider { width: 80px; accent-color: #6ab0ff; }

  /* Welcome / empty state */
  #welcome {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    text-align: center; color: #889; animation: fadeIn 2s ease;
  }
  #welcome h1 { font-size: 2.2em; font-weight: 300; letter-spacing: 0.08em; color: #c8d8f0; margin-bottom: 10px; }
  #welcome p { font-size: 1em; margin: 6px 0; }
  @keyframes fadeIn { from { opacity: 0; transform: translate(-50%,-50%) translateY(20px); } to { opacity: 1; transform: translate(-50%,-50%) translateY(0); } }

  /* Meteor photo */
  .meteor {
    position: absolute; pointer-events: none;
    transition: none;
    filter: drop-shadow(0 0 12px rgba(180,200,255,0.7));
  }
  .meteor img {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(150,180,255,0.5), 0 0 60px rgba(120,160,255,0.3);
  }
  .meteor .trail {
    position: absolute; top: 50%; transform: translateY(-50%);
    height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(180,200,255,0.9), rgba(120,160,255,0.4), transparent);
    pointer-events: none;
  }

  /* Photo wall (when paused/viewing) */
  #photo-wall {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; z-index: 20;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
    overflow-y: auto; padding: 60px 40px;
    flex-wrap: wrap; justify-content: center; gap: 20px; align-content: flex-start;
  }
  #photo-wall.show { display: flex; }
  #photo-wall .card {
    width: 180px; height: 240px; border-radius: 10px; overflow: hidden;
    cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #photo-wall .card:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(100,150,255,0.4); }
  #photo-wall .card img { width: 100%; height: 100%; object-fit: cover; }

  /* Lightbox */
  #lightbox {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 30;
    background: rgba(0,0,0,0.92); display: none; justify-content: center; align-items: center;
    cursor: pointer;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 4px; box-shadow: 0 0 80px rgba(100,150,255,0.3); }

  /* Toast */
  #toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #ccc; padding: 10px 24px;
    border-radius: 20px; font-size: 14px; z-index: 99; opacity: 0; transition: opacity 0.4s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* Speed slider */
  #speed-control {
    display: flex; align-items: center; gap: 6px; color: #667; font-size: 12px;
  }
  #speed-slider { width: 60px; accent-color: #6ab0ff; }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div id="meteor-layer"></div>

<div id="ui-layer">
  <div id="top-bar">
    <button class="btn active" id="btn-auto" onclick="toggleMode('auto')">流星模式</button>
    <button class="btn" id="btn-wall" onclick="toggleMode('wall')">照片墙</button>
    <button class="btn" id="btn-load-folder" onclick="loadFromSaved()">加载照片</button>
    <button class="btn" id="btn-load-music" onclick="document.getElementById('music-input').click()">加载音乐</button>
    <div id="speed-control">
      <span>流速</span>
      <input type="range" id="speed-slider" min="1" max="10" value="5" oninput="updateSpeed()">
    </div>
  </div>

  <div id="music-bar">
    <button class="btn" id="btn-prev" onclick="prevSong()">⏮</button>
    <button class="btn" id="btn-play" onclick="togglePlay()">▶</button>
    <button class="btn" id="btn-next" onclick="nextSong()">⏭</button>
    <span id="song-info">未加载音乐</span>
    <input type="range" id="volume-slider" min="0" max="100" value="50" oninput="updateVolume()">
    <button class="btn" id="btn-mute" onclick="toggleMute()">🔊</button>
  </div>

  <div id="welcome">
    <h1>Memory Meteor Shower</h1>
    <p>照片化作流星，划过记忆的星空</p>
    <p style="font-size:0.85em;color:#556;">拖拽照片到窗口 / 点击「加载照片」开始</p>
  </div>
</div>

<div id="photo-wall"></div>
<div id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src=""></div>
<div id="toast"></div>

<!-- Hidden inputs -->
<input type="file" id="music-input" accept="audio/*" multiple style="display:none" onchange="handleMusicUpload(event)">
<input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="handlePhotoUpload(event)">

<script>
// ==================== Starfield ====================
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => { resize(); initStars(); });

function initStars() {
  stars = [];
  const count = Math.floor((W * H) / 800);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.8 + 0.3,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005,
      baseAlpha: Math.random() * 0.6 + 0.4
    });
  }
}

function drawStars() {
  ctx.clearRect(0, 0, W, H);
  for (const s of stars) {
    s.twinkle += s.speed;
    const alpha = s.baseAlpha + Math.sin(s.twinkle) * 0.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,220,255,${Math.max(0.1, alpha)})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}

// ==================== Meteor System ====================
const meteorLayer = document.getElementById('meteor-layer');
let photoUrls = [];
let meteors = [];
let meteorTimer = null;
let currentMode = 'auto';
let meteorInterval = 4000;
let meteorSpeed = 5; // 1-10

function updateSpeed() {
  meteorSpeed = parseInt(document.getElementById('speed-slider').value);
  meteorInterval = 7000 - (meteorSpeed * 550);
  resetMeteorTimer();
}
updateSpeed();

function resetMeteorTimer() {
  if (meteorTimer) clearInterval(meteorTimer);
  if (currentMode === 'auto' && photoUrls.length > 0) {
    meteorTimer = setInterval(spawnMeteor, meteorInterval);
  }
}

function spawnMeteor() {
  if (photoUrls.length === 0) return;
  const el = document.createElement('div');
  el.className = 'meteor';
  const size = 100 + Math.random() * 140;
  const startY = Math.random() * (H - size - 100) + 50;
  const startX = -size - Math.random() * 400;
  const endX = W + size + Math.random() * 200;
  const duration = (12 - meteorSpeed) * 1000 + Math.random() * 4000;

  el.style.cssText = `
    width:${size}px; height:${size*0.75}px;
    left:${startX}px; top:${startY}px;
    transition: left ${duration}ms linear, top ${duration*0.4}ms ease-in-out, opacity 1.5s;
    opacity:0;
  `;

  const img = document.createElement('img');
  img.src = photoUrls[Math.floor(Math.random() * photoUrls.length)];
  img.draggable = false;

  const trail = document.createElement('div');
  trail.className = 'trail';
  trail.style.cssText = `right:102%; width:${size*1.5}px;`;

  el.appendChild(trail);
  el.appendChild(img);
  meteorLayer.appendChild(el);
  meteors.push(el);

  requestAnimationFrame(() => {
    el.style.opacity = '1';
    el.style.left = `${endX}px`;
    el.style.top = `${startY + (Math.random() - 0.5) * 200}px`;
  });

  const removeTimer = setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
      meteors = meteors.filter(m => m !== el);
    }, 1500);
  }, duration - 1000);

  el._removeTimer = removeTimer;
}

function toggleMode(mode) {
  currentMode = mode;
  document.getElementById('btn-auto').classList.toggle('active', mode === 'auto');
  document.getElementById('btn-wall').classList.toggle('active', mode === 'wall');

  if (mode === 'auto') {
    document.getElementById('photo-wall').classList.remove('show');
    resetMeteorTimer();
  } else {
    if (meteorTimer) clearInterval(meteorTimer);
    // Clear existing meteors
    for (const m of meteors) { if (m.parentNode) m.parentNode.removeChild(m); }
    meteors = [];
    showPhotoWall();
  }
}

// ==================== Photo Management ====================
function addPhotos(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const url = URL.createObjectURL(f);
    if (!photoUrls.includes(url)) photoUrls.push(url);
  }
  document.getElementById('welcome').style.display = 'none';
  resetMeteorTimer();
  if (currentMode === 'auto' && photoUrls.length > 0) {
    spawnMeteor(); // Show first one quickly
  }
  toast(`已加载 ${photoUrls.length} 张照片`);
}

function handlePhotoUpload(e) { if (e.target.files.length) addPhotos(e.target.files); }

function loadFromSaved() {
  // Use the photo-input to let user select (can't auto-read dir from browser)
  document.getElementById('photo-input').click();
}

// Drag & drop
document.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
document.addEventListener('drop', e => {
  e.preventDefault(); e.stopPropagation();
  if (e.dataTransfer.files.length) addPhotos(e.dataTransfer.files);
});

// ==================== Photo Wall ====================
function showPhotoWall() {
  const wall = document.getElementById('photo-wall');
  wall.innerHTML = '';
  for (const url of photoUrls) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<img src="${url}" loading="lazy">`;
    card.onclick = (ev) => { ev.stopPropagation(); showLightbox(url); };
    wall.appendChild(card);
  }
  wall.classList.add('show');
}

function showLightbox(url) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = url;
  lb.classList.add('show');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }

// ==================== Music System ====================
let audio = new Audio();
let playlist = [];
let currentTrack = -1;
let isPlaying = false;

function handleMusicUpload(e) {
  const files = Array.from(e.target.files);
  for (const f of files) {
    if (!f.type.startsWith('audio/')) continue;
    const url = URL.createObjectURL(f);
    playlist.push({ name: f.name, url });
  }
  if (currentTrack < 0 && playlist.length > 0) {
    currentTrack = 0;
    loadTrack();
  }
  updateSongInfo();
  toast(`已加载 ${playlist.length} 首音乐`);
}

function loadTrack() {
  if (currentTrack < 0 || currentTrack >= playlist.length) return;
  const wasPlaying = isPlaying;
  audio.src = playlist[currentTrack].url;
  audio.load();
  if (wasPlaying) audio.play().catch(() => {});
  updateSongInfo();
}

function togglePlay() {
  if (playlist.length === 0) { document.getElementById('music-input').click(); return; }
  if (isPlaying) { audio.pause(); isPlaying = false; }
  else { audio.play().catch(() => {}); isPlaying = true; }
  updatePlayBtn();
}
function prevSong() {
  if (playlist.length === 0) return;
  currentTrack = currentTrack <= 0 ? playlist.length - 1 : currentTrack - 1;
  loadTrack();
  if (isPlaying) audio.play().catch(() => {});
}
function nextSong() {
  if (playlist.length === 0) return;
  currentTrack = (currentTrack + 1) % playlist.length;
  loadTrack();
  if (isPlaying) audio.play().catch(() => {});
}
function updateVolume() { audio.volume = document.getElementById('volume-slider').value / 100; }
function toggleMute() {
  audio.muted = !audio.muted;
  document.getElementById('btn-mute').textContent = audio.muted ? '🔇' : '🔊';
}
function updatePlayBtn() { document.getElementById('btn-play').textContent = isPlaying ? '⏸' : '▶'; }
function updateSongInfo() {
  document.getElementById('song-info').textContent =
    playlist.length === 0 ? '未加载音乐' :
    currentTrack < 0 ? `${playlist.length} 首就绪` :
    `${currentTrack+1}/${playlist.length} ${playlist[currentTrack].name}`;
}

// Auto-play next
audio.addEventListener('ended', () => { nextSong(); if (isPlaying) audio.play().catch(()=>{}); });
audio.volume = 0.5;

// ==================== Keyboard shortcuts ====================
document.addEventListener('keydown', e => {
  switch(e.key.toLowerCase()) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'arrowleft': prevSong(); break;
    case 'arrowright': nextSong(); break;
    case 'm': toggleMute(); break;
    case 'escape': closeLightbox(); break;
    case 'f': loadFromSaved(); break;
  }
});

// ==================== Toast ====================
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2000);
}

// ==================== Init ====================
resize();
initStars();
drawStars();
updateSongInfo();
</script>
</body>
</html>
