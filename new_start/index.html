<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>纪念日时光相册 · Memory Meteor Shower</title>
<script>
window._EXIF_OK = false;
window._EXIF_FAIL = false;
</script>
<script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.min.js"
onload="window._EXIF_OK=true" onerror="window._EXIF_FAIL=true;console.warn('EXIF CDN unreachable')" async></script>
<style>
/* ═══════════════════════════════════════════════════════════════════
MEMORY METEOR SHOWER — 记忆流星雨
双击 index.html 即可在 Windows 上直接运行
═══════════════════════════════════════════════════════════════════ */
:root {
--bg: #06060f;
--text: #e8e0f0;
--muted: #8a80a0;
--rose: #e895af;
--gold: #f0c860;
--film-bg: rgba(10,8,20,0.85);
--film-border: rgba(255,255,255,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
color: var(--text);
user-select: none;
}

/* ── Canvas ── */
#scene {
position: fixed; inset: 0; z-index: 1;
cursor: pointer;
}

/* ── Upload hint (floating) ── */
#upload-hint {
position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
z-index: 50; pointer-events: none;
display: flex; flex-direction: column; align-items: center;
gap: 18px; opacity: 0; transition: opacity 0.8s;
}
#upload-hint.visible { opacity: 1; }
#upload-hint .icon { font-size: 3rem; opacity: 0.5; }
#upload-hint .text {
color: var(--muted); font-size: 0.92rem;
text-align: center; line-height: 1.8; letter-spacing: 0.05em;
}

/* ── Top bar ── */
#topbar {
position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
z-index: 100;
display: flex; gap: 8px; align-items: center;
padding: 7px 10px;
background: var(--film-bg);
backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
border: 1px solid var(--film-border);
border-radius: 36px;
}
#topbar button {
padding: 9px 16px; border: none; border-radius: 28px;
background: transparent; color: var(--text);
font-size: 0.84rem; font-weight: 500;
cursor: pointer; transition: 0.3s; outline: none;
white-space: nowrap; letter-spacing: 0.02em;
}
#topbar button:hover { background: rgba(255,255,255,0.08); }
#topbar button:active { transform: scale(0.95); }
#topbar .btn-upload {
background: linear-gradient(135deg, var(--rose), #c06080);
color: #fff; font-weight: 600;
box-shadow: 0 4px 18px rgba(200,100,130,0.3);
}
#topbar .btn-upload:hover { box-shadow: 0 6px 24px rgba(200,100,130,0.5); }
	#topbar .btn-music {
	background: rgba(255,255,255,0.06); font-size: 1rem;
	}
	#topbar .btn-music:hover { background: rgba(255,255,255,0.14); }
	#topbar .btn-export {
	background: linear-gradient(135deg, var(--gold), #d4a030);
	color: #1a1020; font-weight: 600;
	box-shadow: 0 4px 18px rgba(240,200,96,0.25);
	}
	#topbar .btn-export:hover { box-shadow: 0 6px 24px rgba(240,200,96,0.45); }
#topbar .divider { width: 1px; height: 20px; background: var(--film-border); border-radius: 1px; }
#topbar .title { font-size: 0.85rem; font-weight: 600; padding: 0 4px; white-space: nowrap; }

/* ── Horizontal filmstrip ── */
#filmstrip-wrap {
position: fixed; bottom: 0; left: 0; right: 0; z-index: 80;
padding: 8px 0 12px;
background: linear-gradient(to top, rgba(6,6,15,0.95) 0%, rgba(6,6,15,0.7) 70%, transparent 100%);
transform: translateY(calc(100% - 48px));
transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
}
#filmstrip-wrap:hover,
#filmstrip-wrap.pinned { transform: translateY(0); }
#filmstrip-wrap .handle {
width: 40px; height: 5px; border-radius: 3px;
background: rgba(255,255,255,0.2);
margin: 0 auto 10px;
}
#filmstrip {
display: flex; gap: 10px; overflow-x: auto;
padding: 0 16px 4px;
scroll-behavior: smooth;
-webkit-overflow-scrolling: touch;
scrollbar-width: none;
}
#filmstrip::-webkit-scrollbar { display: none; }
#filmstrip .thumb {
flex-shrink: 0; width: 56px; height: 72px;
border-radius: 10px; overflow: hidden;
border: 2px solid transparent;
cursor: pointer; transition: 0.3s;
position: relative;
background: rgba(255,255,255,0.04);
}
#filmstrip .thumb:hover,
#filmstrip .thumb.active {
border-color: var(--rose);
box-shadow: 0 0 18px rgba(200,120,150,0.4);
transform: translateY(-4px);
}
#filmstrip .thumb img {
width: 100%; height: 100%; object-fit: cover;
}
#filmstrip .thumb .live-dot {
position: absolute; top: 4px; right: 4px;
width: 8px; height: 8px; border-radius: 50%;
background: var(--rose);
box-shadow: 0 0 6px var(--rose);
}
#filmstrip .thumb .vid-dot {
position: absolute; top: 4px; right: 4px;
width: 8px; height: 8px; border-radius: 50%;
background: var(--gold);
box-shadow: 0 0 6px var(--gold);
}
#filmstrip .thumb .thumb-date {
position: absolute; bottom: 2px; left: 0; right: 0;
text-align: center; font-size: 0.5rem;
color: rgba(255,255,255,0.7);
text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}

/* ── Fullscreen preview ── */
#preview-overlay {
position: fixed; inset: 0; z-index: 200;
display: none;
background: rgba(4,4,12,0.94);
backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
flex-direction: column; align-items: center; justify-content: center;
padding: 20px;
}
#preview-overlay.open { display: flex; }
#preview-overlay .pv-media {
max-width: 92vw; max-height: 76vh;
object-fit: contain; border-radius: 14px;
box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 60px rgba(200,140,160,0.12);
}
#preview-overlay video.pv-media { min-width: 200px; }
#preview-overlay .pv-meta {
margin-top: 14px; color: var(--muted);
font-size: 0.84rem; text-align: center;
}
#preview-overlay .pv-close,
#preview-overlay .pv-nav {
position: absolute; z-index: 10;
width: 42px; height: 42px; border-radius: 50%;
border: 1px solid rgba(255,255,255,0.12);
background: rgba(255,255,255,0.05);
color: #fff; font-size: 1.2rem; cursor: pointer;
display: flex; align-items: center; justify-content: center;
transition: 0.3s;
}
#preview-overlay .pv-close:hover,
#preview-overlay .pv-nav:hover { background: rgba(255,255,255,0.14); }
#preview-overlay .pv-close { top: 20px; right: 20px; }
#preview-overlay .pv-nav.prev { top: 50%; left: 12px; transform: translateY(-50%); }
#preview-overlay .pv-nav.next { top: 50%; right: 12px; transform: translateY(-50%); }

	/* ── Music bar ── */
	#music-bar {
	position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
	padding: 10px 16px;
	background: linear-gradient(to top, rgba(6,6,15,0.95), rgba(6,6,15,0.75));
	backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
	border-top: 1px solid var(--film-border);
	display: flex; align-items: center; gap: 10px;
	transform: translateY(100%);
	transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
	}
	#music-bar.open { transform: translateY(0); }
	#music-bar .mu-btn {
	width: 34px; height: 34px; border-radius: 50%;
	border: 1px solid rgba(255,255,255,0.15);
	background: rgba(255,255,255,0.05); color: #ddd;
	font-size: 0.85rem; cursor: pointer;
	display: flex; align-items: center; justify-content: center;
	transition: 0.25s; flex-shrink: 0;
	}
	#music-bar .mu-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
	#music-bar .mu-btn.active { background: rgba(200,130,160,0.25); border-color: var(--rose); color: var(--rose); }
	#music-bar .mu-info {
	flex: 1; min-width: 0; font-size: 0.78rem; color: var(--muted);
	overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
	}
	#music-bar .mu-vol { width: 64px; accent-color: var(--rose); }
	#music-bar .mu-mode {
	padding: 3px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
	background: transparent; color: #999; font-size: 0.65rem; cursor: pointer;
	transition: 0.25s; flex-shrink: 0; min-width: 32px; text-align: center;
	}
	#music-bar .mu-mode:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
	#music-bar .mu-mode.active { color: var(--gold); border-color: var(--gold); }

	/* Push filmstrip up when music bar is open */
	#music-bar.open ~ #filmstrip-wrap { bottom: 60px; }

/* ── Responsive ── */
@media (max-width: 480px) {
#topbar { gap: 3px; padding: 5px 6px; border-radius: 30px; }
#topbar button { padding: 7px 10px; font-size: 0.74rem; }
#topbar .title { font-size: 0.74rem; }
#topbar .divider { display: none; }
#filmstrip .thumb { width: 44px; height: 58px; border-radius: 8px; }
}

	/* ── Toast ── */
	#toast-container {
	position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
	z-index: 300; display: flex; flex-direction: column; align-items: center;
	gap: 8px; pointer-events: none;
	}
	.toast {
	padding: 10px 22px; border-radius: 24px;
	background: rgba(20,16,40,0.92); color: #e8e0f0;
	font-size: 0.84rem; backdrop-filter: blur(12px);
	border: 1px solid rgba(255,255,255,0.1);
	animation: toastIn 0.35s ease, toastOut 0.35s ease 2.2s forwards;
	pointer-events: auto; white-space: nowrap;
	}
	@keyframes toastIn { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
	@keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(-8px); } }
</style>
</head>
<body>

<!-- Toast container -->
<div id="toast-container"></div>

<canvas id="scene"></canvas>

<!-- Upload hint -->
<div id="upload-hint" class="visible">
<div class="icon">💫</div>
<p class="text">点击右上角「上传」<br>让回忆化作流星</p>
</div>

<!-- Top bar -->
<div id="topbar">
<span class="title">💫 记忆流星雨</span>
<span class="divider"></span>
<button onclick="document.getElementById('file-input').click()" class="btn-upload">+ 上传</button>
	<button onclick="document.getElementById('music-input').click()" class="btn-music" id="btn-music-toggle">🎵</button>
	<button onclick="exportGift()" class="btn-export" id="btn-export">💝 导出</button>
</div>
<input type="file" id="file-input" multiple accept="image/*,video/*,.gif" style="display:none" onchange="handleFiles(this.files)">
	<input type="file" id="music-input" multiple accept="audio/*" style="display:none" onchange="handleMusicFiles(this.files)">

<!-- Music bar -->
<div id="music-bar">
<button class="mu-btn" onclick="prevTrack()" title="上一首">⏮</button>
<button class="mu-btn" id="mu-play" onclick="togglePlay()" title="播放/暂停">▶</button>
<button class="mu-btn" onclick="nextTrack()" title="下一首">⏭</button>
<span class="mu-info" id="mu-info">未加载音乐</span>
<button class="mu-mode" id="mu-shuffle" onclick="toggleShuffle()" title="随机播放">🔀</button>
<button class="mu-mode" id="mu-loop" onclick="toggleLoop()" title="循环模式">🔁</button>
<input type="range" class="mu-vol" id="mu-vol" min="0" max="100" value="60" oninput="onVolChange()" title="音量">
</div>

<!-- Filmstrip -->
<div id="filmstrip-wrap">
<div class="handle"></div>
<div id="filmstrip"></div>
</div>

<!-- Preview -->
<div id="preview-overlay">
<button class="pv-close" onclick="closePreview()">✕</button>
<button class="pv-nav prev" onclick="navPreview(-1)">◀</button>
<button class="pv-nav next" onclick="navPreview(1)">▶</button>
<div id="preview-media-wrap"></div>
<div class="pv-meta" id="preview-meta"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
METEOR SHOWER ENGINE
═══════════════════════════════════════════════════════════════════ */

var _CLEAN_HTML_SOURCE = document.documentElement.outerHTML;

// ── Polyfill ──
if (!CanvasRenderingContext2D.prototype.roundRect) {
CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
if (typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
this.beginPath(); this.moveTo(x+r.tl,y); this.lineTo(x+w-r.tr,y);
this.quadraticCurveTo(x+w,y,x+w,y+r.tr); this.lineTo(x+w,y+h-r.br);
this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h); this.lineTo(x+r.bl,y+h);
this.quadraticCurveTo(x,y+h,x,y+h-r.bl); this.lineTo(x,y+r.tl);
this.quadraticCurveTo(x,y,x+r.tl,y); this.closePath();
};
}

// ── State ──
const photos = [];         // { id, name, dataUrl, dateTaken, type, img/video, isGif, isVideo }
let meteors = [];          // { photoIdx, x, y, vx, vy, size, trail:[], hue, phase, opacity, fadeIn }
let previewIdx = -1;
let animId = null;
let time = 0;
let hoveredMeteor = null;
let mouseX = -100, mouseY = -100;
let blobUrls = [];

// DOM
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const filmstrip = document.getElementById('filmstrip');
const filmstripWrap = document.getElementById('filmstrip-wrap');
const uploadHint = document.getElementById('upload-hint');
const previewOverlay = document.getElementById('preview-overlay');

// ═══════════════════════════════════════════════════════════════════
// FILE HANDLING
// ═══════════════════════════════════════════════════════════════════
async function handleFiles(files) {
if (!files || !files.length) return;
uploadHint.classList.remove('visible');

const batch = [];
for (const f of files) {
try {
const isVideo = f.type.startsWith('video/');
const isGif = f.type === 'image/gif';
const dataUrl = isVideo ? null : await readBlob(f);
const date = await getExifDate(f);
let img = null, video = null;

if (isVideo) {
video = URL.createObjectURL(f);
blobUrls.push(video);
} else {
img = await loadImg(dataUrl);
}

batch.push({
id: Date.now() + Math.random(),
name: f.name, dataUrl, dateTaken: date,
type: isVideo ? 'video' : 'image',
isGif, isVideo,
img, video,
videoBlob: isVideo ? f : null,
});
} catch (err) {
console.warn('跳过文件 ' + f.name + ': ' + err.message);
toast('无法加载: ' + f.name);
}
}

for (const p of batch) photos.push(p);
photos.sort((a,b) => a.dateTaken - b.dateTaken);
spawnMeteors();
renderFilmstrip();
}

async function compressImage(file, quality, maxWidth) {
quality = quality || 0.72;
maxWidth = maxWidth || 1600;
return new Promise((resolve, reject) => {
const img = new Image();
img.onload = () => {
let w = img.width, h = img.height;
if (w > maxWidth) { h = h * (maxWidth / w); w = maxWidth; }
const cv = document.createElement('canvas');
cv.width = w; cv.height = h;
const cctx = cv.getContext('2d');
cctx.drawImage(img, 0, 0, w, h);
if (file.type === 'image/gif') { resolve(cv.toDataURL()); return; }
resolve(cv.toDataURL('image/webp', quality));
};
img.onerror = reject;
const rd = new FileReader();
rd.onload = e => { img.src = e.target.result; };
rd.onerror = reject;
rd.readAsDataURL(file);
});
}

async function readBlob(file) {
if (file.type.startsWith('image/') && file.type !== 'image/gif') {
try { return await compressImage(file); } catch (e) { console.warn('压缩失败', e); }
}
return new Promise((resolve, reject) => {
const rd = new FileReader();
rd.onload = e => resolve(e.target.result);
rd.onerror = () => reject(new Error('Failed to read file: ' + file.name));
rd.readAsDataURL(file);
});
}
function loadImg(src) {
return new Promise((resolve, reject) => {
const i = new Image();
i.onload = () => resolve(i);
i.onerror = () => reject(new Error('Failed to load image: ' + src.substring(0, 60)));
i.src = src;
});
}

async function getExifDate(file) {
if (window._EXIF_OK && typeof EXIF !== 'undefined') {
try {
const d = await new Promise(resolve => {
EXIF.getData(file, function() {
const ds = EXIF.getTag(this, 'DateTimeOriginal');
if (ds) {
const pd = new Date(ds.replace(/^(\d{4}):(\d{2}):(\d{2})/, '$1-$2-$3'));
if (!isNaN(pd.getTime())) { resolve(pd); return; }
}
resolve(null);
});
});
if (d) return d;
} catch(e) { /* fallback */ }
}
return new Date(file.lastModified || Date.now());
}

// ═══════════════════════════════════════════════════════════════════
// STARFIELD
// ═══════════════════════════════════════════════════════════════════
let stars = [], nebulaBlobs = [];

function initStarfield(w, h) {
stars = [];
for (let i = 0; i < 200; i++) {
stars.push({
x: Math.random()*w, y: Math.random()*h,
r: Math.random()*1.8+0.3,
twinkle: Math.random()*0.025+0.006,
phase: Math.random()*Math.PI*2,
hue: 240 + Math.random()*120,
});
}
// Bright accent stars
for (let i = 0; i < 15; i++) {
stars.push({
x: Math.random()*w, y: Math.random()*h*0.5,
r: Math.random()*2.8+1.2,
twinkle: Math.random()*0.04+0.015,
phase: Math.random()*Math.PI*2,
hue: 30 + Math.random()*50,
});
}
nebulaBlobs = [];
for (let i = 0; i < 4; i++) {
nebulaBlobs.push({
x: Math.random()*w, y: Math.random()*h,
r: 100+Math.random()*220,
hue: [280,320,340,200,35][i],
alpha: 0.03+Math.random()*0.04,
});
}
}

function drawStarfield(ctx, w, h, t) {
// Deep space
const bg = ctx.createRadialGradient(w*0.35, h*0.3, w*0.05, w*0.5, h*0.5, w*1.3);
bg.addColorStop(0, '#100d24');
bg.addColorStop(0.5, '#090714');
bg.addColorStop(1, '#04030c');
ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);

// Nebula
for (const n of nebulaBlobs) {
const g = ctx.createRadialGradient(n.x, n.y, n.r*0.05, n.x, n.y, n.r);
g.addColorStop(0, `hsla(${n.hue},55%,55%,${n.alpha*1.6})`);
g.addColorStop(1, 'transparent');
ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
}

// Stars
for (const s of stars) {
const tw = Math.sin(t*s.twinkle+s.phase)*0.5+0.5;
ctx.fillStyle = `hsla(${s.hue},35%,88%,${0.25+tw*0.75})`;
ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
if (s.r>1.5 && tw>0.75) {
ctx.fillStyle = `hsla(${s.hue},50%,92%,${tw*0.18})`;
ctx.beginPath(); ctx.arc(s.x,s.y,s.r*3.5,0,Math.PI*2); ctx.fill();
}
}
}

// ═══════════════════════════════════════════════════════════════════
// ROSE PETALS
// ═══════════════════════════════════════════════════════════════════
let petals = [];
function initPetals(w, h) {
petals = [];
for (let i = 0; i < 40; i++) {
petals.push({
x: Math.random()*w*1.3-w*0.15, y: Math.random()*-h-20,
s: 3+Math.random()*8, vy: 0.25+Math.random()*0.8,
sway: 0.007+Math.random()*0.02, swayAmp: 0.3+Math.random()*1.4,
swayPh: Math.random()*Math.PI*2, rot: Math.random()*Math.PI*2,
rotV: (Math.random()-0.5)*0.03, hue: 340+Math.random()*35, a: 0.35+Math.random()*0.45,
});
}
}
function drawPetals(ctx, w, h, t) {
for (const p of petals) {
p.y += p.vy; p.x += Math.sin(t*p.sway*8+p.swayPh)*p.swayAmp; p.rot += p.rotV;
if (p.y>h+50) { p.y=-30; p.x=Math.random()*w*1.3-w*0.15; }
ctx.save(); ctx.globalAlpha = p.a; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
const s = p.s;
ctx.fillStyle = `hsl(${p.hue},70%,76%)`;
ctx.beginPath();
ctx.moveTo(0,-s); ctx.bezierCurveTo(s*0.6,-s*0.7,s*0.8,-s*0.2,0,s*0.6);
ctx.bezierCurveTo(-s*0.8,-s*0.2,-s*0.6,-s*0.7,0,-s);
ctx.fill();
ctx.restore();
}
}

// ═══════════════════════════════════════════════════════════════════
// METEOR SYSTEM
// ═══════════════════════════════════════════════════════════════════
function spawnMeteors() {
const w = innerWidth, h = innerHeight;
meteors = photos.map((p, i) => {
return {
photoIdx: i,
x: w*0.1 + Math.random()*w*0.8,
y: h*0.1 + Math.random()*h*0.5,
vx: (Math.random()-0.5)*0.35,
vy: 0.15 + Math.random()*0.4,
size: 32 + Math.random()*20,
trail: [],
hue: (i*37+180)%360,
phase: Math.random()*Math.PI*2,
opacity: 0,
fadeIn: true,
life: 0,
};
});
}

function updateMeteors(w, h) {
for (const m of meteors) {
m.life += 0.005;

// Fade in
if (m.fadeIn) {
m.opacity += 0.008;
if (m.opacity >= 0.85) { m.opacity = 0.85; m.fadeIn = false; }
}

// Gentle sinusoidal drift
const swayX = Math.sin(time*0.012 + m.phase) * 0.3;
const swayY = Math.cos(time*0.009 + m.phase) * 0.15;

m.x += m.vx + swayX;
m.y += m.vy + swayY;

// Wrap around edges
if (m.x < -60) m.x = w + 40;
if (m.x > w + 60) m.x = -40;
if (m.y < -60) m.y = h + 40;
if (m.y > h + 60) m.y = -40;

// Trail
m.trail.push({ x: m.x, y: m.y, a: 1 });
if (m.trail.length > 18) m.trail.shift();
for (const t of m.trail) t.a *= 0.88;
}
}

function drawMeteors(ctx, w, h) {
// Sort by y for depth
const sorted = [...meteors].sort((a,b) => a.y - b.y);

for (const m of sorted) {
if (m.opacity < 0.02) continue;
const p = photos[m.photoIdx];
if (!p) continue;

ctx.save();
ctx.globalAlpha = m.opacity;

const s = m.size;

// ── Trail ──
if (m.trail.length > 1) {
for (let i = 1; i < m.trail.length; i++) {
const t = m.trail[i];
const ta = t.a * 0.5;
if (ta < 0.01) continue;
const trailS = s * 0.3 * (i / m.trail.length);
const grad = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, trailS);
grad.addColorStop(0, `rgba(255,220,180,${ta})`);
grad.addColorStop(0.5, `rgba(255,180,200,${ta*0.5})`);
grad.addColorStop(1, 'transparent');
ctx.fillStyle = grad;
ctx.beginPath(); ctx.arc(t.x, t.y, trailS, 0, Math.PI*2); ctx.fill();
}
}

// ── Outer glow ──
const glow = ctx.createRadialGradient(m.x, m.y, s*0.15, m.x, m.y, s*1.4);
glow.addColorStop(0, `rgba(255,240,220,${0.5})`);
glow.addColorStop(0.3, `rgba(255,200,180,${0.25})`);
glow.addColorStop(0.6, `rgba(200,160,200,${0.08})`);
glow.addColorStop(1, 'transparent');
ctx.fillStyle = glow;
ctx.beginPath(); ctx.arc(m.x, m.y, s*1.4, 0, Math.PI*2); ctx.fill();

// ── Photo orb (oval mask) ──
const orbW = s * 0.9;
const orbH = s * 1.05;

// Hover scale
let scale = 1;
if (hoveredMeteor === m) {
scale = 1.25;
}

ctx.save();
ctx.translate(m.x, m.y);
ctx.scale(scale, scale);

// Orb border glow
ctx.strokeStyle = 'rgba(255,255,255,0.5)';
ctx.lineWidth = 1.2;
ctx.beginPath();
ctx.ellipse(0, 0, orbW, orbH, 0, 0, Math.PI*2);
ctx.stroke();

// Clip to oval
ctx.beginPath();
ctx.ellipse(0, 0, orbW-2, orbH-2, 0, 0, Math.PI*2);
ctx.clip();

// Draw photo thumbnail
if (p.img) {
// For GIF images, the img object handles animation natively in the expanded view
// In meteor form we just draw the current frame
const iw = p.img.width, ih = p.img.height;
const imgScale = Math.max((orbW*2)/iw, (orbH*2)/ih);
const dw = iw * imgScale, dh = ih * imgScale;
ctx.drawImage(p.img, -dw/2, -dh/2, dw, dh);

// Overlay gradient for depth
const overlay = ctx.createRadialGradient(0, 0, orbW*0.4, 0, 0, orbW);
overlay.addColorStop(0, 'transparent');
overlay.addColorStop(1, 'rgba(10,8,20,0.3)');
ctx.fillStyle = overlay;
ctx.fillRect(-orbW, -orbH, orbW*2, orbH*2);
} else if (p.isVideo) {
// Video indicator
ctx.fillStyle = 'rgba(0,0,0,0.4)';
ctx.fillRect(-orbW, -orbH, orbW*2, orbH*2);
ctx.fillStyle = '#fff';
ctx.font = `${orbW*0.6}px sans-serif`;
ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
ctx.fillText('▶', 0, 0);
}

ctx.restore();

// ── Sparkle points ──
const sparkCount = 3;
for (let i = 0; i < sparkCount; i++) {
const sa = time*3 + i*2.1 + m.phase;
const sr = s * (0.8 + Math.sin(sa)*0.3);
const sx = m.x + Math.cos(sa)*sr;
const sy = m.y + Math.sin(sa)*sr*0.7;
const sparkAlpha = 0.3 + Math.sin(sa*1.7)*0.3;
ctx.fillStyle = `rgba(255,255,240,${sparkAlpha})`;
ctx.beginPath(); ctx.arc(sx, sy, 1.2, 0, Math.PI*2); ctx.fill();
}

ctx.restore();
}
}

// ═══════════════════════════════════════════════════════════════════
// HIT TESTING
// ═══════════════════════════════════════════════════════════════════
function hitTestMeteor(mx, my) {
let best = null, bestDist = 50;
// Check in reverse (top-most first)
for (let i = meteors.length-1; i >= 0; i--) {
const m = meteors[i];
if (m.opacity < 0.1) continue;
const dist = Math.hypot(mx - m.x, my - m.y);
if (dist < m.size * 1.5 && dist < bestDist) {
bestDist = dist; best = m;
}
}
return best;
}

// ═══════════════════════════════════════════════════════════════════
// FILMSTRIP (horizontal timeline)
// ═══════════════════════════════════════════════════════════════════
function renderFilmstrip() {
filmstrip.innerHTML = photos.map((p, i) => `
<div class="thumb" onclick="openPreview(${i})" data-idx="${i}">
${p.isGif ? '<div class="live-dot"></div>' : ''}
${p.isVideo ? '<div class="vid-dot"></div>' : ''}
<img src="${p.isVideo ? '' : p.dataUrl}" alt="">
<div class="thumb-date">${fmtShort(p.dateTaken)}</div>
</div>
`).join('');

// Show filmstrip
filmstripWrap.classList.add('pinned');
setTimeout(() => filmstripWrap.classList.remove('pinned'), 3000);
}

function highlightFilmstrip(idx) {
const thumbs = filmstrip.querySelectorAll('.thumb');
thumbs.forEach((t, i) => t.classList.toggle('active', i === idx));
if (idx >= 0) {
const thumb = thumbs[idx];
if (thumb) thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}
}

// ═══════════════════════════════════════════════════════════════════
// PREVIEW
// ═══════════════════════════════════════════════════════════════════
function openPreview(idx) {
previewIdx = idx;
const p = photos[idx];
const wrap = document.getElementById('preview-media-wrap');

if (p.isVideo) {
wrap.innerHTML = `<video class="pv-media" src="${p.video}" controls autoplay loop playsinline></video>`;
} else {
wrap.innerHTML = `<img class="pv-media" src="${p.dataUrl}" alt="${p.name}">`;
}

document.getElementById('preview-meta').textContent =
`${p.name} · ${fmtDate(p.dateTaken)} · ${idx+1}/${photos.length}`;
previewOverlay.classList.add('open');
highlightFilmstrip(idx);
}

function closePreview() {
previewOverlay.classList.remove('open');
const wrap = document.getElementById('preview-media-wrap');
wrap.innerHTML = '';
previewIdx = -1;
}

function navPreview(d) {
if (!photos.length) return;
previewIdx = (previewIdx + d + photos.length) % photos.length;
openPreview(previewIdx);
}

// ═══════════════════════════════════════════════════════════════════
// MOUSE / TOUCH
// ═══════════════════════════════════════════════════════════════════
canvas.addEventListener('mousemove', e => {
const rect = canvas.getBoundingClientRect();
mouseX = e.clientX - rect.left;
mouseY = e.clientY - rect.top;
hoveredMeteor = hitTestMeteor(mouseX, mouseY);
canvas.style.cursor = hoveredMeteor ? 'pointer' : 'default';
});

canvas.addEventListener('mouseleave', () => {
hoveredMeteor = null;
mouseX = -100; mouseY = -100;
});

canvas.addEventListener('click', e => {
if (!photos.length) return;
const rect = canvas.getBoundingClientRect();
const mx = e.clientX - rect.left;
const my = e.clientY - rect.top;
const hit = hitTestMeteor(mx, my);
if (hit) {
openPreview(hit.photoIdx);
}
});

// Touch
canvas.addEventListener('touchmove', e => {
e.preventDefault();
const rect = canvas.getBoundingClientRect();
mouseX = e.touches[0].clientX - rect.left;
mouseY = e.touches[0].clientY - rect.top;
hoveredMeteor = hitTestMeteor(mouseX, mouseY);
}, { passive: false });

canvas.addEventListener('touchend', e => {
if (hoveredMeteor) {
openPreview(hoveredMeteor.photoIdx);
hoveredMeteor = null;
}
});

// ═══════════════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
if (previewOverlay.classList.contains('open')) {
if (e.key === 'Escape') closePreview();
if (e.key === 'ArrowLeft') navPreview(-1);
if (e.key === 'ArrowRight') navPreview(1);
return;
}
// Music shortcuts (when preview closed)
if (e.key === ' ') { e.preventDefault(); togglePlay(); }
if (e.key === 'ArrowLeft') prevTrack();
if (e.key === 'ArrowRight') nextTrack();
if (e.key === 'm' || e.key === 'M') document.getElementById('music-bar').classList.toggle('open');
});

// ═══════════════════════════════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════════════════════════════
function resize() {
const dpr = devicePixelRatio || 1;
const w = innerWidth, h = innerHeight;
canvas.width = w * dpr; canvas.height = h * dpr;
canvas.style.width = w+'px'; canvas.style.height = h+'px';
ctx.setTransform(1,0,0,1,0,0);
ctx.scale(dpr, dpr);
initStarfield(w, h);
initPetals(w, h);
return { w, h };
}

let size = resize();
let resizeTimer = null;
window.addEventListener('resize', () => {
clearTimeout(resizeTimer);
resizeTimer = setTimeout(() => { size = resize(); }, 200);
});

function loop(ms) {
time = ms * 0.001;
const { w, h } = size;

drawStarfield(ctx, w, h, time);
if (photos.length > 0) {
updateMeteors(w, h);
drawMeteors(ctx, w, h);
}
drawPetals(ctx, w, h, time);

animId = requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════════
// MUSIC PLAYER
// ═══════════════════════════════════════════════════════════════════
let playlist = [];       // [{ name, dataUrl }]
let trackIdx = -1;
let audio = new Audio();
audio.volume = 0.6;
let shuffle = false;
let loopMode = 0;       // 0=none, 1=one, 2=all

async function handleMusicFiles(files) {
  if (!files || !files.length) return;
  for (const f of files) {
    if (!f.type.startsWith('audio/')) continue;
    try {
      const dataUrl = await readBlob(f);
      playlist.push({ name: f.name, dataUrl: dataUrl });
    } catch (e) {
      console.warn('音乐加载失败: ' + f.name, e);
      toast('音乐加载失败: ' + f.name);
    }
  }
  if (playlist.length > 0) {
    if (trackIdx < 0) { trackIdx = 0; loadTrack(); }
    updateMusicUI();
    document.getElementById('music-bar').classList.add('open');
    toast('已加载 ' + playlist.length + ' 首音乐');
  }
}

function loadTrack() {
  if (trackIdx < 0 || trackIdx >= playlist.length) return;
  const wasPlaying = !audio.paused;
  audio.src = playlist[trackIdx].dataUrl;
  audio.load();
  if (wasPlaying) audio.play().catch(() => {});
  updateMusicUI();
}

function togglePlay() {
  if (playlist.length === 0) {
    document.getElementById('music-input').click();
    return;
  }
  if (audio.paused) { audio.play().catch(() => {}); }
  else { audio.pause(); }
  updateMusicUI();
}

function prevTrack() {
  if (playlist.length === 0) return;
  if (shuffle) {
    trackIdx = Math.floor(Math.random() * playlist.length);
  } else {
    trackIdx = trackIdx <= 0 ? playlist.length - 1 : trackIdx - 1;
  }
  loadTrack();
}

function nextTrack() {
  if (playlist.length === 0) return;
  if (shuffle) {
    trackIdx = Math.floor(Math.random() * playlist.length);
  } else {
    trackIdx = (trackIdx + 1) % playlist.length;
  }
  loadTrack();
}

function toggleShuffle() {
  shuffle = !shuffle;
  document.getElementById('mu-shuffle').classList.toggle('active', shuffle);
}

function toggleLoop() {
  loopMode = (loopMode + 1) % 3;
  const btn = document.getElementById('mu-loop');
  btn.classList.remove('active');
  if (loopMode === 1) { btn.textContent = '🔂'; btn.classList.add('active'); }
  else if (loopMode === 2) { btn.textContent = '🔁'; btn.classList.add('active'); }
  else { btn.textContent = '🔁'; }
}

function onVolChange() {
  audio.volume = document.getElementById('mu-vol').value / 100;
}

function updateMusicUI() {
  document.getElementById('mu-play').textContent = audio.paused ? '▶' : '⏸';
  const info = document.getElementById('mu-info');
  if (playlist.length === 0) {
    info.textContent = '未加载音乐';
  } else if (trackIdx < 0 || trackIdx >= playlist.length) {
    info.textContent = playlist.length + ' 首就绪';
  } else {
    info.textContent = (trackIdx + 1) + '/' + playlist.length + ' ' + playlist[trackIdx].name;
  }
}

audio.addEventListener('ended', () => {
  if (loopMode === 1) { audio.currentTime = 0; audio.play().catch(() => {}); }
  else if (loopMode === 2 && trackIdx === playlist.length - 1) { trackIdx = -1; }
  if (loopMode !== 1) nextTrack();
  if (!audio.paused || loopMode === 1) { audio.play().catch(() => {}); updateMusicUI(); }
});

audio.addEventListener('play', updateMusicUI);
audio.addEventListener('pause', updateMusicUI);

// Toggle music bar visibility
document.getElementById('btn-music-toggle').addEventListener('click', function(e) {
  if (playlist.length === 0) {
    document.getElementById('music-input').click();
    return;
  }
  document.getElementById('music-bar').classList.toggle('open');
});

// ═══════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════
function fmtDate(d) {
return d.getFullYear()+'年'+String(d.getMonth()+1).padStart(2,'0')+'月'+
String(d.getDate()).padStart(2,'0')+'日 '+String(d.getHours()).padStart(2,'0')+':'+
String(d.getMinutes()).padStart(2,'0');
}

function fmtShort(d) {
return (d.getMonth()+1)+'/'+d.getDate();
}

// ═══════════════════════════════════════════════════════════════════
// CLEANUP
// ═══════════════════════════════════════════════════════════════════
function cleanup() {
if (animId) { cancelAnimationFrame(animId); animId = null; }
for (const url of blobUrls) { URL.revokeObjectURL(url); }
blobUrls = [];
}
window.addEventListener('beforeunload', cleanup);

	// ═══════════════════════════════════════════════════════════════════
	// TOAST
	// ═══════════════════════════════════════════════════════════════════
	function toast(msg) {
	const container = document.getElementById('toast-container');
	if (!container) return;
	const el = document.createElement('div');
	el.className = 'toast';
	el.textContent = msg;
	container.appendChild(el);
	setTimeout(() => { if (el.parentNode) el.remove(); }, 2800);
	}

	// ═══════════════════════════════════════════════════════════════════
	// EXPORT — bundle everything into a self-contained HTML gift
	// ═══════════════════════════════════════════════════════════════════
	async function exportGift() {
	if (photos.length === 0 && playlist.length === 0) {
	toast('请先上传照片或音乐');
	return;
	}

	toast('正在打包...');

	try {
	// 1. Photos already have dataUrl; videos need readBlob from videoBlob
	const embedPhotos = await Promise.all(photos.map(async (p) => {
	let videoDataUrl = null;
	if (p.videoBlob) {
	try { videoDataUrl = await readBlob(p.videoBlob); } catch(e) {}
	}
	return {
	name: p.name, dataUrl: p.dataUrl, videoDataUrl,
	dateTaken: p.dateTaken.toISOString(),
	type: p.type, isGif: p.isGif, isVideo: p.isVideo,
	};
	}));

	// 2. Music already stored as dataUrl — use directly
	const embedMusic = playlist.map(t => ({ name: t.name, dataUrl: t.dataUrl }));

	const embedData = JSON.stringify({ photos: embedPhotos, music: embedMusic });
	const safeEmbedData = embedData.replace(/<\//g, '<\\/');

	// 3. Use clean HTML source captured at page load (no XHR/fetch needed)
	let html = _CLEAN_HTML_SOURCE || '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

	// 4. Inject embedded data before </body>
	const dataScript = '<script id="embed-data" type="application/json">' + safeEmbedData + '</' + 'script>';
	const lastBody = html.lastIndexOf('</body>');
	if (lastBody !== -1) {
	html = html.slice(0, lastBody) + dataScript + '\n</body>' + html.slice(lastBody + 7);
	} else {
	html += '\n' + dataScript;
	}

	// 6. Download
	const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
	const url = URL.createObjectURL(blob);
	const a = document.createElement('a');
	a.href = url;
	const now = new Date();
	const ds = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+
	String(now.getDate()).padStart(2,'0');
	a.download = 'Memory_Meteor_Shower_' + ds + '.html';
	document.body.appendChild(a);
	a.click();
	document.body.removeChild(a);
	setTimeout(() => URL.revokeObjectURL(url), 5000);

	const sizeMB = (blob.size / 1024 / 1024).toFixed(1);
	toast('导出完成！文件大小 ' + sizeMB + ' MB，发送这个 HTML 即可');
	} catch(e) {
	console.error('Export failed:', e);
	toast('导出失败: ' + e.message);
	}
	}

	// ═══════════════════════════════════════════════════════════════════
	// BOOT FROM EMBEDDED DATA (for exported gift HTML)
	// Uses DOMContentLoaded so #embed-data is parsed before we read it
	// ═══════════════════════════════════════════════════════════════════
	document.addEventListener('DOMContentLoaded', function bootFromEmbed() {
	const embedEl = document.getElementById('embed-data');
	if (!embedEl || !embedEl.textContent.trim()) return;

	try {
	const data = JSON.parse(embedEl.textContent);

	if (data.photos && data.photos.length) {
	Promise.all(data.photos.map(p => new Promise(resolve => {
	if (p.type === 'video') {
	const mime = p.name.endsWith('.gif') ? 'image/gif' : 'video/mp4';
	const b64 = p.videoDataUrl || p.dataUrl;
	const blob = b64.startsWith('data:') ? base64ToBlob(b64, mime) : null;
	const vUrl = blob ? URL.createObjectURL(blob) : b64;
	if (vUrl.startsWith('blob:')) blobUrls.push(vUrl);
	photos.push({
	id: Date.now() + Math.random(),
	name: p.name, dataUrl: p.dataUrl,
	dateTaken: new Date(p.dateTaken),
	type: 'video', isGif: p.isGif, isVideo: true,
	img: null, video: vUrl, videoBlob: blob,
	});
	resolve();
	} else {
	const img = new Image();
	img.onload = () => {
	photos.push({
	id: Date.now() + Math.random(),
	name: p.name, dataUrl: p.dataUrl,
	dateTaken: new Date(p.dateTaken),
	type: 'image', isGif: p.isGif, isVideo: false,
	img, video: null, videoBlob: null,
	});
	resolve();
	};
	img.onerror = () => resolve();
	img.src = p.dataUrl;
	}
	}))).then(() => {
	photos.sort((a, b) => a.dateTaken - b.dateTaken);
	spawnMeteors();
	renderFilmstrip();
	uploadHint.classList.remove('visible');
	});
	}

	if (data.music && data.music.length) {
	data.music.forEach(t => {
	playlist.push({ name: t.name, dataUrl: t.dataUrl });
	});
	if (trackIdx < 0) { trackIdx = 0; loadTrack(); }
	updateMusicUI();
	document.getElementById('music-bar').classList.add('open');
	}

	// Clean up the embed tag after loading
	embedEl.remove();
	} catch(e) {
	console.error('Embed boot failed:', e);
	}
	});

	function base64ToBlob(dataUrl, mime) {
	const parts = dataUrl.split(',');
	const bin = atob(parts[1]);
	const bytes = new Uint8Array(bin.length);
	for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
	return new Blob([bytes], { type: mime });
	}


// ═══════════════════════════════════════════════════════════════════
// DRAG & DROP
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
document.addEventListener('dragenter', e => { e.preventDefault(); e.stopPropagation(); });
document.addEventListener('drop', e => {
e.preventDefault(); e.stopPropagation();
const files = e.dataTransfer.files;
if (files && files.length) handleFiles(files);
});

// ═══════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════
setTimeout(() => { if (!window._EXIF_OK) window._EXIF_FAIL = true; }, 3000);
animId = requestAnimationFrame(loop);
</script>
